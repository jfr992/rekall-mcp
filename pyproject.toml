[project]
name = "rekall-mcp"
version = "1.12.0"
description = "Persistent memory for AI assistants via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jfr992" }]
keywords = ["mcp", "memory", "ai", "claude", "llm", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.12,<1.18",
    "fastembed>=0.8,<0.9",
    "networkx>=3.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
torch = ["sentence-transformers>=3.0.0"]
ollama = ["ollama>=0.1.0"]
gemini = ["google-generativeai>=0.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "tiktoken>=0.7",
]

[project.scripts]
rekall = "memory.cli:main"
rekall-mcp = "server:main_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory", "src/core", "src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/server.py" = "server.py"
"src/config.py" = "config.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v -m 'not wheel'"
markers = [
    "integration: real Qdrant on :6334 required",
    "eval_live: real claude -p invocations, costs money",
    "wheel: builds + installs the wheel in a clean venv (slow; CI wheel gate / pytest -m wheel)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memory", "core", "tools"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mcp.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "tdd-guard-pytest>=0.1.2",
]
