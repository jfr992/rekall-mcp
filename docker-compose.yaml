  # Rekall MCP - Docker Compose
#
# Quick start:
#   docker compose up -d
#
# This starts Qdrant (vector database) and the MCP server with memory tools.
# Everything runs in containers - no local Python install needed.
#
# DATA STORAGE:
#   - Memory files: named volume `rekall-memory` (survives container deletion)
#   - Qdrant data: named volume `rekall-qdrant` (survives container deletion)
#
# Existing installs with data at ~/.claude/: keep your bind mounts via
# docker-compose.bind-mounts.example.yaml (see docs/MIGRATION.md).

services:
  # =========================================================================
  # QDRANT - Vector Database (required)
  # =========================================================================
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      # Bind host side to loopback only — Qdrant has no auth by default
      - "127.0.0.1:6333:6333"
    volumes:
      - rekall-qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # Qdrant image has no curl/wget; TCP check via bash built-in
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # MCP SERVER - Memory Tools (default)
  # =========================================================================
  mcp:
    build: .
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - REKALL_ALLOWED_HOSTS=${REKALL_ALLOWED_HOSTS:-mcp}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Publish synthesis (optional): LLM-distilled briefs for the /kb Synthesize button
      - REKALL_PUBLISH_MODEL=${REKALL_PUBLISH_MODEL:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - MCP_TRANSPORT=streamable-http
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MEMORY_STORAGE_PATH=/data/memory
      # Container must bind all interfaces for port-mapping to work;
      # the host-side mapping below is loopback-only.
      - HOST=0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rekall-memory:/data/memory
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =========================================================================
  # COCKPIT UI - Next.js web cockpit (port 3333)
  # =========================================================================
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        # Baked into the Next rewrite at build time (standalone output).
        REKALL_API_URL: http://mcp:8000
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      - mcp
    restart: unless-stopped

  # =========================================================================
  # OLLAMA - Local Embeddings (optional, better quality)
  # =========================================================================
  # Uncomment to use Ollama instead of fastembed
  # Then set EMBEDDING_PROVIDER=ollama in your .env file
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   # Pull the embedding model on first run:
  #   # docker exec memory-ollama ollama pull nomic-embed-text

  # =========================================================================
  # DEVELOPMENT - With hot reload
  # =========================================================================
  mcp-dev:
    build: .
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - REKALL_PUBLISH_MODEL=${REKALL_PUBLISH_MODEL:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - MCP_TRANSPORT=streamable-http
      - LOG_LEVEL=DEBUG
      - MEMORY_STORAGE_PATH=/data/memory
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./src:/app/src
      - rekall-memory:/data/memory
    depends_on:
      qdrant:
        condition: service_healthy
    profiles:
      - dev

  # =========================================================================
  # QDRANT TEST - Isolated test database
  # =========================================================================
  qdrant-test:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "127.0.0.1:6334:6333"
    tmpfs:
      - /qdrant/storage:size=1G
    healthcheck:
      # Qdrant image has no curl/wget; TCP check via bash built-in
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - test
    restart: "no"

  # =========================================================================
  # TESTS
  # =========================================================================
  test:
    build:
      context: .
      # Prod image carries no dev deps; the test stage adds pytest et al.
      target: test
    environment:
      - QDRANT_URL=http://qdrant-test:6333
      - MEMORY_STORAGE_PATH=/tmp/test_memory
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./benchmarks:/app/benchmarks:ro
      - ./claude:/app/claude:ro
      - ./README.md:/app/README.md:ro
      - ./.env.example:/app/.env.example:ro
      - ./docker-compose.yaml:/app/docker-compose.yaml:ro
    depends_on:
      qdrant-test:
        condition: service_healthy
    profiles:
      - test
    entrypoint: ["pytest", "-v", "tests/"]

volumes:
  rekall-memory:
  rekall-qdrant:
