services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memento-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ~/.claude/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
